# Builds the app and publishes it to GitHub Pages.
#
# The site is a Pages *project* site, so it is served from /aquaen-web/ — the
# path is set once as `base` in vite.config.ts, and the manifest and service
# worker derive their own paths from it rather than repeating it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer commit is the one that should win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The domain logic is a 1:1 port of the Swift original and is tested as
      # such; a red suite should stop the deploy, not ship alongside it.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
